# FGT-Azure — Phase 3 Running Configuration
# FortiGate-VM BYOL on Azure Marketplace (Gen2 image: fortinet_fg-vm_g2)
# VM Size: Standard_F1alds_v7 (1 vCPU / 2 GB RAM — trial license limit)
# Region: East US 2
# Role: Azure-side FortiGate (AS 65002)
# Captured: 2026-05-14
#
# Key differences from Phase 1 (GNS3 stand-in):
#   - port1/port2 use DHCP (Azure assigns IPs: 10.100.1.4, 10.100.2.4)
#   - port2 has defaultgw disabled (only port1 gets Azure fabric default route)
#   - IPsec phase1 uses "set type dynamic" (dial-up responder, no remote-gw)
#   - IPsec phase1 uses "set net-device enable" per Fortinet Azure recommendation
#   - IPsec transport is "auto" (NAT-T auto-negotiates)
#   - No port3 (Azure BYOL deploys with 2 NICs only)
#   - Static routes for Azure fabric gateway, 168.63.129.16, and workload subnet
#   - Management via Azure serial console only (trial license TLS too weak for browsers)
#
# Credentials (not stored here):
#   IPsec PSK : see Bitwarden item "FortiGate - IPsec PSK Hybrid Lab"
#   BGP MD5   : see Bitwarden item "FortiGate - BGP MD5 Hybrid Lab"

config system interface
    edit "port1"
        set vdom "root"
        set mode dhcp
        set allowaccess ping https ssh
        set type physical
    next
    edit "port2"
        set vdom "root"
        set mode dhcp
        set type physical
        set defaultgw disable
    next
    edit "to-onprem"
        set vdom "root"
        set ip 10.255.255.2 255.255.255.255
        set allowaccess ping
        set type tunnel
        set remote-ip 10.255.255.1 255.255.255.255
        set interface "port1"
    next
end

config router static
    edit 1
        set gateway 10.100.1.1
        set device "port1"
        set comment "default route via Azure fabric gateway"
    next
    edit 2
        set dst 168.63.129.16 255.255.255.255
        set gateway 10.100.1.1
        set device "port1"
        set comment "Azure service IP - health probes, metadata, licensing"
    next
    edit 3
        set dst 10.100.10.0 255.255.255.0
        set gateway 10.100.2.1
        set device "port2"
        set comment "workload subnet via trust gateway - needed for BGP advertisement"
    next
end

config vpn ipsec phase1-interface
    edit "to-onprem"
        set type dynamic
        set interface "port1"
        set ike-version 2
        set keylife 28800
        set peertype any
        set net-device enable
        set proposal des-sha256
        set dpd on-idle
        set dhgrp 14
        set transport auto
        set psksecret <PSK>
        set dpd-retryinterval 60
    next
end

config vpn ipsec phase2-interface
    edit "to-onprem-p2"
        set phase1name "to-onprem"
        set proposal des-sha256
        set dhgrp 14
        set keylifeseconds 3600
    next
end

config firewall policy
    edit 1
        set name "LAN-to-OnPrem"
        set srcintf "port2"
        set dstintf "to-onprem"
        set action accept
        set srcaddr "all"
        set dstaddr "all"
        set schedule "always"
        set service "ALL"
    next
    edit 2
        set name "OnPrem-to-LAN"
        set srcintf "to-onprem"
        set dstintf "port2"
        set action accept
        set srcaddr "all"
        set dstaddr "all"
        set schedule "always"
        set service "ALL"
    next
end

config router bgp
    set as 65002
    set router-id 10.255.255.2
    config neighbor
        edit "10.255.255.1"
            set remote-as 65001
            set update-source "to-onprem"
            set password <BGP-MD5>
        next
    end
    config network
        edit 1
            set prefix 10.100.10.0 255.255.255.0
        next
    end
end
