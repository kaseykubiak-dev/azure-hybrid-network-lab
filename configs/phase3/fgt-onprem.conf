config system interface
    edit "port1"
        set vdom "root"
        set ip 203.0.113.1 255.255.255.252
        set allowaccess ping
        set type physical
    next
    edit "port2"
        set vdom "root"
        set ip 192.168.10.1 255.255.255.0
        set allowaccess ping
        set type physical
    next
    edit "port3"
        set vdom "root"
        set mode dhcp
        set allowaccess ping https
        set status down
        set type physical
        set description "MGMT-OOB"
    next
    edit "to-azure"
        set vdom "root"
        set ip 10.255.255.1 255.255.255.255
        set allowaccess ping
        set type tunnel
        set remote-ip 10.255.255.2 255.255.255.255
        set interface "port1"
    next
end

config router static
    edit 1
        set gateway 203.0.113.2
        set device "port1"
    next
end

config vpn ipsec phase1-interface
    edit "to-azure"
        set interface "port1"
        set ike-version 2
        set keylife 28800
        set peertype any
        set net-device disable
        set proposal des-sha256
        set dhgrp 14
        set transport udp
        set remote-gw 20.122.29.13
        set psksecret <PSK>
    next
end

config vpn ipsec phase2-interface
    edit "to-azure-p2"
        set phase1name "to-azure"
        set proposal des-sha256
        set dhgrp 14
        set auto-negotiate enable
        set keylifeseconds 3600
    next
end

config firewall policy
    edit 1
        set name "LAN-to-Azure"
        set srcintf "port2"
        set dstintf "to-azure"
        set action accept
        set srcaddr "all"
        set dstaddr "all"
        set schedule "always"
        set service "ALL"
    next
    edit 2
        set name "Azure-to-LAN"
        set srcintf "to-azure"
        set dstintf "port2"
        set action accept
        set srcaddr "all"
        set dstaddr "all"
        set schedule "always"
        set service "ALL"
    next
end

config router bgp
    set as 65001
    set router-id 10.255.255.1
    config neighbor
        edit "10.255.255.2"
            set remote-as 65002
            set update-source "to-azure"
            set password <BGP-MD5>
        next
    end
    config network
        edit 1
            set prefix 192.168.10.0 255.255.255.0
        next
    end
end
