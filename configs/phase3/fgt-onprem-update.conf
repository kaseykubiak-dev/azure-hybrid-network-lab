# FGT-OnPrem — Phase 3 Update
# Only one change: point remote-gw at the real Azure public IP.
#
# Replace <AZURE-PUBLIC-IP> with the actual IP shown by deploy-lab.sh
# (or run: az network public-ip show -g rg-hybrid-lab -n pip-fgt-untrust --query ipAddress -o tsv)
#
# Paste this into the on-prem FortiGate CLI in GNS3.

config vpn ipsec phase1-interface
    edit "to-azure"
        set remote-gw <AZURE-PUBLIC-IP>
    next
end

# After pasting, bring the tunnel up:
#   execute ping <AZURE-PUBLIC-IP>
#   diagnose vpn ike gateway list
#
# If IKE doesn't establish, check:
#   - NSG allows UDP 500/4500 from your WAN IP (or Internet) to 10.100.1.4
#   - FortiGate is licensed (unlicensed = no transit traffic)
#   - PSK matches on both sides
#   - Both sides are IKEv2
#   - Proposal matches (des-sha256 / dhgrp 14)
