# FGT-Azure — Phase 3 Base Configuration
# FortiGate-VM BYOL on Azure (Marketplace)
# Role: Azure-side FortiGate (AS 65002)
#
# Paste these blocks into the FortiGate CLI after licensing.
# Order matters: interfaces → static routes → admin access → policies → IPsec → BGP
#
# Prerequisites:
#   - FortiGate VM is running and licensed (web GUI → FortiGuard → activate BYOL trial)
#   - Login via web GUI at https://<AZURE-PUBLIC-IP> with azureadmin / <password>
#   - Open CLI console from web GUI (or SSH to port1 IP if enabled)
#
# Credentials (not stored here):
#   IPsec PSK : see Bitwarden item "FortiGate - IPsec PSK Hybrid Lab"
#   BGP MD5   : see Bitwarden item "FortiGate - BGP MD5 Hybrid Lab"
#
# Deviations from Phase 1:
#   - port1 is now 10.100.1.4/24 (Azure private IP, public IP is platform NAT)
#   - port2 is now 10.100.2.4/24 (trust subnet, not workload subnet)
#   - Default gateway is 10.100.1.1 (Azure fabric first-IP-in-subnet)
#   - IPsec phase1 uses "set type dynamic" (dial-up responder, no remote-gw)
#   - phase1 uses "set net-device enable" per Fortinet Azure recommendation
#   - No port3 (Azure BYOL deploys with 2 NICs only)
#   - Additional static routes for 168.63.129.16 and 10.100.10.0/24

# ═══════════════════════════════════════════════════════════════════════════
# BLOCK 1: Interfaces
# ═══════════════════════════════════════════════════════════════════════════
# Azure Marketplace deployment pre-configures port1 and port2 with the
# private IPs from the NIC. Verify with "get system interface" first.
# If already correct, skip this block. If not, apply:

config system interface
    edit "port1"
        set vdom "root"
        set ip 10.100.1.4 255.255.255.0
        set allowaccess ping https ssh
        set type physical
        set description "untrust - WAN"
    next
    edit "port2"
        set vdom "root"
        set ip 10.100.2.4 255.255.255.0
        set allowaccess ping
        set type physical
        set description "trust - LAN"
    next
end

# ═══════════════════════════════════════════════════════════════════════════
# BLOCK 2: Static routes
# ═══════════════════════════════════════════════════════════════════════════

config router static
    edit 1
        set gateway 10.100.1.1
        set device "port1"
        set comment "default route via Azure fabric gateway"
    next
    edit 2
        set dst 168.63.129.16 255.255.255.255
        set gateway 10.100.1.1
        set device "port1"
        set comment "Azure service IP - health probes, metadata, licensing"
    next
    edit 3
        set dst 10.100.10.0 255.255.255.0
        set gateway 10.100.2.1
        set device "port2"
        set comment "workload subnet via trust gateway - needed for BGP advertisement"
    next
end

# ═══════════════════════════════════════════════════════════════════════════
# BLOCK 3: Firewall policies (trust ↔ tunnel)
# ═══════════════════════════════════════════════════════════════════════════
# Apply AFTER the IPsec tunnel interface exists (Block 4 creates it).
# If you paste this before Block 4, the "to-onprem" interface won't exist
# and the policy will fail. Paste Blocks 4+5 first, then come back here.
#
# ALTERNATIVE: paste everything in order and accept that policies will
# reference a not-yet-existing interface. FortiOS allows this in some
# versions. If it errors, skip to Block 4, then return here.

config firewall policy
    edit 1
        set name "LAN-to-OnPrem"
        set srcintf "port2"
        set dstintf "to-onprem"
        set action accept
        set srcaddr "all"
        set dstaddr "all"
        set schedule "always"
        set service "ALL"
    next
    edit 2
        set name "OnPrem-to-LAN"
        set srcintf "to-onprem"
        set dstintf "port2"
        set action accept
        set srcaddr "all"
        set dstaddr "all"
        set schedule "always"
        set service "ALL"
    next
end

# ═══════════════════════════════════════════════════════════════════════════
# BLOCK 4: IPsec VPN (phase1 + phase2)
# ═══════════════════════════════════════════════════════════════════════════
# IMPORTANT: Replace <PSK> with the actual pre-shared key from Bitwarden.
#
# Key difference from Phase 1:
#   - "set type dynamic" — Azure FGT is the dial-up responder
#   - No "set remote-gw" — accepts any initiator with correct PSK
#   - "set net-device enable" — Fortinet Azure recommendation

config vpn ipsec phase1-interface
    edit "to-onprem"
        set type dynamic
        set interface "port1"
        set ike-version 2
        set keylife 28800
        set peertype any
        set net-device enable
        set proposal des-sha256
        set dhgrp 14
        set dpd on-idle
        set dpd-retryinterval 60
        set psksecret <PSK>
    next
end

config vpn ipsec phase2-interface
    edit "to-onprem-p2"
        set phase1name "to-onprem"
        set proposal des-sha256
        set dhgrp 14
        set auto-negotiate enable
        set keylifeseconds 3600
    next
end

# Configure the tunnel interface IPs (same as Phase 1)
config system interface
    edit "to-onprem"
        set vdom "root"
        set ip 10.255.255.2 255.255.255.255
        set allowaccess ping
        set type tunnel
        set remote-ip 10.255.255.1 255.255.255.255
        set interface "port1"
    next
end

# ═══════════════════════════════════════════════════════════════════════════
# BLOCK 5: BGP
# ═══════════════════════════════════════════════════════════════════════════
# IMPORTANT: Replace <BGP-MD5> with the BGP MD5 password from Bitwarden.
# Identical to Phase 1 — BGP peers over tunnel IPs, not physical IPs.

config router bgp
    set as 65002
    set router-id 10.255.255.2
    config neighbor
        edit "10.255.255.1"
            set remote-as 65001
            set update-source "to-onprem"
            set password <BGP-MD5>
        next
    end
    config network
        edit 1
            set prefix 10.100.10.0 255.255.255.0
        next
    end
end
