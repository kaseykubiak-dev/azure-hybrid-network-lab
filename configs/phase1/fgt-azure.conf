# FGT-Azure — Phase 1 Configuration
# FortiGate-VM64-KVM v7.6.6 build3652
# Serial: FGVMEVSLD3YBY_82
# Role: Azure-side FortiGate (AS 65002) — GNS3 stand-in, replaced by real Azure BYOL in Phase 3
# Captured: 2026-05-13
#
# Credentials used (not stored here):
#   IPsec PSK : Lab#Hybrid1
#   BGP MD5   : BGP#Lab1
#
# See fgt-onprem.conf for full deviation notes — same issues apply to both sides.

config system interface
    edit "port1"
        set vdom "root"
        set ip 198.51.100.2 255.255.255.252
        set allowaccess ping
        set type physical
    next
    edit "port2"
        set vdom "root"
        set ip 10.100.10.1 255.255.255.0
        set allowaccess ping
        set type physical
    next
    edit "port3"
        set vdom "root"
        set mode dhcp
        set allowaccess https
        set status down
        set type physical
    next
    edit "to-onprem"
        set vdom "root"
        set ip 10.255.255.2 255.255.255.255
        set allowaccess ping
        set type tunnel
        set remote-ip 10.255.255.1 255.255.255.255
        set interface "port1"
    next
end

config router static
    edit 1
        set gateway 198.51.100.1
        set device "port1"
    next
end

config vpn ipsec phase1-interface
    edit "to-onprem"
        set interface "port1"
        set ike-version 2
        set keylife 28800
        set peertype any
        set net-device disable
        set proposal des-sha256
        set dhgrp 14
        set transport udp
        set remote-gw 203.0.113.1
        set psksecret Lab#Hybrid1
    next
end

config vpn ipsec phase2-interface
    edit "to-onprem-p2"
        set phase1name "to-onprem"
        set proposal des-sha256
        set dhgrp 14
        set auto-negotiate enable
        set keylifeseconds 3600
    next
end

config firewall policy
    edit 1
        set name "LAN-to-OnPrem"
        set srcintf "port2"
        set dstintf "to-onprem"
        set action accept
        set srcaddr "all"
        set dstaddr "all"
        set schedule "always"
        set service "ALL"
    next
    edit 2
        set name "OnPrem-to-LAN"
        set srcintf "to-onprem"
        set dstintf "port2"
        set action accept
        set srcaddr "all"
        set dstaddr "all"
        set schedule "always"
        set service "ALL"
    next
end

config router bgp
    set as 65002
    set router-id 10.255.255.2
    config neighbor
        edit "10.255.255.1"
            set remote-as 65001
            set update-source "to-onprem"
            set password BGP#Lab1
        next
    end
    config network
        edit 1
            set prefix 10.100.10.0 255.255.255.0
        next
    end
end
