<svg viewBox="0 0 960 680" xmlns="http://www.w3.org/2000/svg" role="img">
  <title>Azure Hybrid Network Lab - High-Level Topology</title>
  <desc>Site-to-site IPsec IKEv2 VPN with eBGP between on-prem GNS3 (AS 65001) and Azure (AS 65002), with traffic flowing from Alpine client through FortiGate on-prem, across an IPsec tunnel over the internet, to FortiGate in Azure, reaching an nginx workload VM.</desc>

  <defs>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <linearGradient id="tunnel-grad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00ffcc" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#0044dd" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#00ffcc" stop-opacity="0.8"/>
    </linearGradient>
    <linearGradient id="divider-grad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00ffcc" stop-opacity="0"/>
      <stop offset="20%" stop-color="#00ffcc"/>
      <stop offset="50%" stop-color="#0044dd"/>
      <stop offset="80%" stop-color="#00ffcc"/>
      <stop offset="100%" stop-color="#00ffcc" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="960" height="680" fill="#020509" rx="8"/>

  <!-- Title bar -->
  <text x="480" y="32" text-anchor="middle" font-family="monospace" font-size="10" fill="#ffaa00" letter-spacing="3">// AZURE HYBRID NETWORK LAB</text>
  <text x="480" y="52" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#eef6ff" font-weight="600">Site-to-Site IPsec/IKEv2 + eBGP Topology</text>
  <line x1="200" y1="64" x2="760" y2="64" stroke="url(#divider-grad)" stroke-width="1"/>

  <!-- ON-PREM ZONE -->
  <rect x="30" y="82" width="420" height="460" rx="6" fill="none" stroke="rgba(0,255,204,0.2)" stroke-width="1" stroke-dasharray="6 3"/>
  <rect x="30" y="82" width="420" height="460" rx="6" fill="rgba(0,255,204,0.02)"/>
  <text x="50" y="106" font-family="monospace" font-size="10" fill="#00ffcc" letter-spacing="2">ON-PREM (GNS3 ON FEDORA)</text>
  <text x="50" y="122" font-family="monospace" font-size="9" fill="#4477aa">AS 65001</text>
  <text x="50" y="144" font-family="monospace" font-size="8" fill="#4477aa">LAN: 192.168.10.0/24</text>
  <text x="50" y="157" font-family="monospace" font-size="8" fill="#4477aa">WAN: 203.0.113.0/30 (RFC 5737)</text>

  <!-- AZURE ZONE -->
  <rect x="510" y="82" width="420" height="460" rx="6" fill="none" stroke="rgba(77,166,255,0.25)" stroke-width="1" stroke-dasharray="6 3"/>
  <rect x="510" y="82" width="420" height="460" rx="6" fill="rgba(77,166,255,0.03)"/>
  <text x="530" y="106" font-family="monospace" font-size="10" fill="#4da6ff" letter-spacing="2">AZURE (EAST US 2)</text>
  <text x="530" y="122" font-family="monospace" font-size="9" fill="#4477aa">AS 65002</text>
  <text x="530" y="144" font-family="monospace" font-size="8" fill="#4477aa">VNet: 10.100.0.0/16</text>
  <text x="530" y="157" font-family="monospace" font-size="8" fill="#4477aa">snet-untrust: 10.100.1.0/24</text>
  <text x="530" y="170" font-family="monospace" font-size="8" fill="#4477aa">snet-trust: 10.100.2.0/24</text>
  <text x="530" y="183" font-family="monospace" font-size="8" fill="#4477aa">snet-workload: 10.100.10.0/24</text>

  <!-- Alpine Client Box -->
  <rect x="60" y="205" width="150" height="80" rx="4" fill="#030812" stroke="rgba(0,255,204,0.25)" stroke-width="1"/>
  <text x="135" y="230" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#eef6ff" font-weight="500">Alpine Client</text>
  <text x="135" y="248" text-anchor="middle" font-family="monospace" font-size="9" fill="#6699cc">192.168.10.100</text>
  <text x="135" y="263" text-anchor="middle" font-family="monospace" font-size="9" fill="#4477aa">wget / ping</text>

  <!-- FGT-OnPrem Box -->
  <rect x="60" y="340" width="180" height="110" rx="4" fill="#030812" stroke="rgba(0,255,204,0.36)" stroke-width="1.5"/>
  <rect x="60" y="340" width="180" height="24" rx="4" fill="rgba(0,255,204,0.08)"/>
  <text x="150" y="356" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#00ffcc" font-weight="600">FGT-OnPrem</text>
  <text x="150" y="380" text-anchor="middle" font-family="monospace" font-size="9" fill="#6699cc">port1: 203.0.113.1 (WAN)</text>
  <text x="150" y="395" text-anchor="middle" font-family="monospace" font-size="9" fill="#6699cc">port2: 192.168.10.1 (LAN)</text>
  <text x="150" y="410" text-anchor="middle" font-family="monospace" font-size="9" fill="#00ffcc">tunnel: 10.255.255.1</text>
  <text x="150" y="428" text-anchor="middle" font-family="monospace" font-size="9" fill="#4477aa">router-id: 10.255.255.1</text>

  <!-- R1 ISP Router Box -->
  <rect x="290" y="365" width="140" height="80" rx="4" fill="#030812" stroke="rgba(77,166,255,0.2)" stroke-width="1"/>
  <text x="360" y="390" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#eef6ff" font-weight="500">R1 (ISP)</text>
  <text x="360" y="408" text-anchor="middle" font-family="monospace" font-size="9" fill="#6699cc">f0/0: 203.0.113.2</text>
  <text x="360" y="422" text-anchor="middle" font-family="monospace" font-size="9" fill="#6699cc">f0/1: DHCP (NAT/PAT)</text>

  <!-- On-prem connections -->
  <line x1="135" y1="285" x2="135" y2="340" stroke="rgba(0,255,204,0.4)" stroke-width="1.5"/>
  <text x="142" y="318" font-family="monospace" font-size="8" fill="#4477aa">port2 (LAN)</text>

  <line x1="240" y1="395" x2="290" y2="395" stroke="rgba(77,166,255,0.4)" stroke-width="1.5"/>
  <text x="265" y="389" text-anchor="middle" font-family="monospace" font-size="7" fill="#4477aa">WAN</text>

  <!-- Internet cloud zone -->
  <rect x="390" y="545" width="180" height="50" rx="25" fill="none" stroke="rgba(77,166,255,0.15)" stroke-width="1"/>
  <rect x="390" y="545" width="180" height="50" rx="25" fill="rgba(77,166,255,0.04)"/>
  <text x="480" y="575" text-anchor="middle" font-family="monospace" font-size="10" fill="#6699cc">REAL INTERNET</text>

  <!-- R1 to Internet -->
  <line x1="360" y1="445" x2="440" y2="545" stroke="rgba(77,166,255,0.3)" stroke-width="1" stroke-dasharray="4 3"/>

  <!-- Internet to Azure public IP -->
  <line x1="520" y1="545" x2="620" y2="445" stroke="rgba(77,166,255,0.3)" stroke-width="1" stroke-dasharray="4 3"/>

  <!-- Azure Public IP Box -->
  <rect x="570" y="395" width="160" height="50" rx="4" fill="#030812" stroke="rgba(77,166,255,0.2)" stroke-width="1"/>
  <text x="650" y="417" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#eef6ff">Azure Public IP</text>
  <text x="650" y="433" text-anchor="middle" font-family="monospace" font-size="9" fill="#4da6ff">20.122.29.13</text>

  <!-- FGT-Azure Box -->
  <rect x="570" y="230" width="180" height="120" rx="4" fill="#030812" stroke="rgba(77,166,255,0.36)" stroke-width="1.5"/>
  <rect x="570" y="230" width="180" height="24" rx="4" fill="rgba(77,166,255,0.08)"/>
  <text x="660" y="246" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#4da6ff" font-weight="600">FGT-Azure</text>
  <text x="660" y="270" text-anchor="middle" font-family="monospace" font-size="9" fill="#6699cc">port1: 10.100.1.4 (untrust)</text>
  <text x="660" y="285" text-anchor="middle" font-family="monospace" font-size="9" fill="#6699cc">port2: 10.100.2.4 (trust)</text>
  <text x="660" y="300" text-anchor="middle" font-family="monospace" font-size="9" fill="#00ffcc">tunnel: 10.255.255.2</text>
  <text x="660" y="318" text-anchor="middle" font-family="monospace" font-size="9" fill="#4477aa">router-id: 10.255.255.2</text>
  <text x="660" y="333" text-anchor="middle" font-family="monospace" font-size="8" fill="#4477aa">set type dynamic (responder)</text>

  <!-- Azure PIP to FGT-Azure -->
  <line x1="650" y1="395" x2="660" y2="350" stroke="rgba(77,166,255,0.4)" stroke-width="1.5"/>
  <text x="668" y="378" font-family="monospace" font-size="8" fill="#4477aa">port1 (untrust)</text>

  <!-- nginx VM Box -->
  <rect x="800" y="230" width="120" height="80" rx="4" fill="#030812" stroke="rgba(0,255,204,0.25)" stroke-width="1"/>
  <text x="860" y="255" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#eef6ff" font-weight="500">nginx VM</text>
  <text x="860" y="273" text-anchor="middle" font-family="monospace" font-size="9" fill="#6699cc">10.100.10.4</text>
  <text x="860" y="288" text-anchor="middle" font-family="monospace" font-size="9" fill="#4477aa">HTTP :80</text>
  <text x="860" y="300" text-anchor="middle" font-family="monospace" font-size="8" fill="#4477aa">no public IP</text>

  <!-- FGT-Azure to nginx -->
  <line x1="750" y1="270" x2="800" y2="270" stroke="rgba(0,255,204,0.4)" stroke-width="1.5"/>
  <text x="775" y="264" text-anchor="middle" font-family="monospace" font-size="7" fill="#4477aa">trust</text>

  <!-- IPsec TUNNEL - the hero element -->
  <path d="M 240 390 C 350 300, 500 300, 570 290" fill="none" stroke="url(#tunnel-grad)" stroke-width="2.5" filter="url(#glow)" stroke-dasharray="8 4">
    <animate attributeName="stroke-dashoffset" values="0;-24" dur="2s" repeatCount="indefinite"/>
  </path>

  <!-- Tunnel label -->
  <rect x="350" y="268" width="200" height="44" rx="4" fill="#030812" stroke="rgba(0,255,204,0.2)" stroke-width="1"/>
  <text x="450" y="285" text-anchor="middle" font-family="monospace" font-size="9" fill="#00ffcc">IPsec IKEv2 (des-sha256, DH14)</text>
  <text x="450" y="300" text-anchor="middle" font-family="monospace" font-size="9" fill="#00ffcc">eBGP: 65001 ↔ 65002 (MD5)</text>

  <!-- Bottom info bar -->
  <line x1="100" y1="620" x2="860" y2="620" stroke="url(#divider-grad)" stroke-width="1"/>
  <text x="480" y="640" text-anchor="middle" font-family="monospace" font-size="9" fill="#4477aa">FortiGate VM 7.6.6 (trial license) | IKEv2 + NAT-T | eBGP over tunnel interfaces | HTTP 200 validated</text>
  <text x="480" y="656" text-anchor="middle" font-family="monospace" font-size="8" fill="#4477aa">Azure: Standard_F1alds_v7 (1 vCPU / 2 GB) | East US 2 | Gen2 image: fortinet_fg-vm_g2</text>

</svg>
