<svg viewBox="0 0 960 720" xmlns="http://www.w3.org/2000/svg" role="img">
  <title>Azure VNet Detail - Subnet, NSG, and UDR Layout</title>
  <desc>Azure VNet 10.100.0.0/16 with three subnets (untrust, trust, workload), NSG rules per subnet, UDR routing through FortiGate NVA, and the VirtualNetwork service tag limitation.</desc>

  <defs>
    <linearGradient id="divider-grad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00ffcc" stop-opacity="0"/>
      <stop offset="20%" stop-color="#00ffcc"/>
      <stop offset="50%" stop-color="#0044dd"/>
      <stop offset="80%" stop-color="#00ffcc"/>
      <stop offset="100%" stop-color="#00ffcc" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="960" height="720" fill="#020509" rx="8"/>

  <!-- Title -->
  <text x="480" y="32" text-anchor="middle" font-family="monospace" font-size="10" fill="#ffaa00" letter-spacing="3">// AZURE HYBRID NETWORK LAB</text>
  <text x="480" y="52" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#eef6ff" font-weight="600">Azure VNet Detail: Subnets, NSGs, and UDRs</text>
  <line x1="200" y1="64" x2="760" y2="64" stroke="url(#divider-grad)" stroke-width="1"/>

  <!-- VNet outer boundary -->
  <rect x="40" y="82" width="880" height="560" rx="6" fill="none" stroke="rgba(77,166,255,0.3)" stroke-width="1.5"/>
  <rect x="40" y="82" width="880" height="560" rx="6" fill="rgba(77,166,255,0.02)"/>
  <text x="60" y="106" font-family="monospace" font-size="11" fill="#4da6ff" letter-spacing="2">VNET: VNET-HYBRID-LAB</text>
  <text x="60" y="122" font-family="monospace" font-size="9" fill="#4477aa">10.100.0.0/16 | East US 2 | rg-hybrid-lab</text>

  <!-- UNTRUST SUBNET -->
  <rect x="60" y="150" width="260" height="310" rx="4" fill="none" stroke="rgba(255,170,0,0.25)" stroke-width="1"/>
  <rect x="60" y="150" width="260" height="310" rx="4" fill="rgba(255,170,0,0.02)"/>
  <text x="80" y="172" font-family="monospace" font-size="10" fill="#ffaa00" letter-spacing="1">SNET-UNTRUST</text>
  <text x="80" y="187" font-family="monospace" font-size="8" fill="#4477aa">10.100.1.0/24</text>
  <text x="80" y="200" font-family="monospace" font-size="8" fill="#4477aa">Gateway: 10.100.1.1 (fabric)</text>

  <!-- FortiGate untrust NIC -->
  <rect x="80" y="220" width="220" height="60" rx="4" fill="#030812" stroke="rgba(77,166,255,0.36)" stroke-width="1.5"/>
  <text x="190" y="242" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#4da6ff" font-weight="600">FGT Untrust NIC</text>
  <text x="190" y="258" text-anchor="middle" font-family="monospace" font-size="9" fill="#6699cc">10.100.1.4 | IP fwd: ON</text>
  <text x="190" y="270" text-anchor="middle" font-family="monospace" font-size="8" fill="#4477aa">+ Azure Public IP: 20.122.29.13</text>

  <!-- NSG untrust -->
  <rect x="80" y="295" width="220" height="150" rx="3" fill="#030812" stroke="rgba(255,170,0,0.2)" stroke-width="1"/>
  <rect x="80" y="295" width="220" height="18" rx="3" fill="rgba(255,170,0,0.08)"/>
  <text x="190" y="307" text-anchor="middle" font-family="monospace" font-size="8" fill="#ffaa00">NSG-UNTRUST</text>
  <text x="90" y="325" font-family="monospace" font-size="7" fill="#00ffcc">IN  100  UDP 500    Internet  Allow</text>
  <text x="90" y="337" font-family="monospace" font-size="7" fill="#00ffcc">IN  110  UDP 4500   Internet  Allow</text>
  <text x="90" y="349" font-family="monospace" font-size="7" fill="#00ffcc">IN  120  ICMP *     Internet  Allow</text>
  <text x="90" y="361" font-family="monospace" font-size="7" fill="#00ffcc">IN  200  TCP 443    Home IP   Allow</text>
  <text x="90" y="373" font-family="monospace" font-size="7" fill="#6699cc">IN 4096  *          *         Deny</text>

  <text x="90" y="393" font-family="monospace" font-size="7" fill="#4477aa">IKE + NAT-T inbound from internet</text>
  <text x="90" y="405" font-family="monospace" font-size="7" fill="#4477aa">ICMP for path testing during build</text>
  <text x="90" y="417" font-family="monospace" font-size="7" fill="#4477aa">HTTPS mgmt from home WAN only</text>

  <!-- TRUST SUBNET -->
  <rect x="350" y="150" width="260" height="310" rx="4" fill="none" stroke="rgba(0,255,204,0.25)" stroke-width="1"/>
  <rect x="350" y="150" width="260" height="310" rx="4" fill="rgba(0,255,204,0.02)"/>
  <text x="370" y="172" font-family="monospace" font-size="10" fill="#00ffcc" letter-spacing="1">SNET-TRUST</text>
  <text x="370" y="187" font-family="monospace" font-size="8" fill="#4477aa">10.100.2.0/24</text>
  <text x="370" y="200" font-family="monospace" font-size="8" fill="#4477aa">Gateway: 10.100.2.1 (fabric)</text>

  <!-- FortiGate trust NIC -->
  <rect x="370" y="220" width="220" height="60" rx="4" fill="#030812" stroke="rgba(0,255,204,0.36)" stroke-width="1.5"/>
  <text x="480" y="242" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#00ffcc" font-weight="600">FGT Trust NIC</text>
  <text x="480" y="258" text-anchor="middle" font-family="monospace" font-size="9" fill="#6699cc">10.100.2.4 | IP fwd: ON</text>
  <text x="480" y="270" text-anchor="middle" font-family="monospace" font-size="8" fill="#4477aa">Forwarding hub for all tunnel traffic</text>

  <!-- NSG trust -->
  <rect x="370" y="295" width="220" height="150" rx="3" fill="#030812" stroke="rgba(0,255,204,0.2)" stroke-width="1"/>
  <rect x="370" y="295" width="220" height="18" rx="3" fill="rgba(0,255,204,0.08)"/>
  <text x="480" y="307" text-anchor="middle" font-family="monospace" font-size="8" fill="#00ffcc">NSG-TRUST</text>
  <text x="380" y="325" font-family="monospace" font-size="7" fill="#00ffcc">IN  100  *  VirtualNetwork  Allow</text>
  <text x="380" y="337" font-family="monospace" font-size="7" fill="#6699cc">IN 4096  *  *               Deny</text>

  <text x="380" y="360" font-family="monospace" font-size="7" fill="#ffaa00">OUT 100  *  10.255.255.0/24  Allow</text>
  <text x="380" y="372" font-family="monospace" font-size="7" fill="#ffaa00">         *  192.168.10.0/24  Allow</text>
  <text x="380" y="384" font-family="monospace" font-size="7" fill="#ffaa00">     dst    10.100.10.0/24</text>

  <text x="380" y="406" font-family="monospace" font-size="7" fill="#ffaa00">CRITICAL: outbound rule required</text>
  <text x="380" y="418" font-family="monospace" font-size="7" fill="#ffaa00">VirtualNetwork tag excludes</text>
  <text x="380" y="430" font-family="monospace" font-size="7" fill="#ffaa00">tunnel + on-prem source IPs</text>

  <!-- WORKLOAD SUBNET -->
  <rect x="640" y="150" width="260" height="310" rx="4" fill="none" stroke="rgba(77,166,255,0.25)" stroke-width="1"/>
  <rect x="640" y="150" width="260" height="310" rx="4" fill="rgba(77,166,255,0.02)"/>
  <text x="660" y="172" font-family="monospace" font-size="10" fill="#4da6ff" letter-spacing="1">SNET-WORKLOAD</text>
  <text x="660" y="187" font-family="monospace" font-size="8" fill="#4477aa">10.100.10.0/24</text>
  <text x="660" y="200" font-family="monospace" font-size="8" fill="#4477aa">rt-workload attached</text>

  <!-- nginx VM -->
  <rect x="660" y="220" width="220" height="50" rx="4" fill="#030812" stroke="rgba(77,166,255,0.3)" stroke-width="1"/>
  <text x="770" y="242" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#eef6ff" font-weight="500">nginx VM</text>
  <text x="770" y="258" text-anchor="middle" font-family="monospace" font-size="9" fill="#6699cc">10.100.10.4 | no public IP</text>

  <!-- NSG workload -->
  <rect x="660" y="285" width="220" height="160" rx="3" fill="#030812" stroke="rgba(77,166,255,0.2)" stroke-width="1"/>
  <rect x="660" y="285" width="220" height="18" rx="3" fill="rgba(77,166,255,0.08)"/>
  <text x="770" y="297" text-anchor="middle" font-family="monospace" font-size="8" fill="#4da6ff">NSG-WORKLOAD</text>
  <text x="670" y="315" font-family="monospace" font-size="7" fill="#00ffcc">IN  100  TCP 80   192.168.10/24 Allow</text>
  <text x="670" y="327" font-family="monospace" font-size="7" fill="#00ffcc">IN  105  *        10.255.255/24 Allow</text>
  <text x="670" y="339" font-family="monospace" font-size="7" fill="#00ffcc">                  192.168.10/24</text>
  <text x="670" y="351" font-family="monospace" font-size="7" fill="#00ffcc">IN  110  TCP 22   10.100.2.4    Allow</text>
  <text x="670" y="363" font-family="monospace" font-size="7" fill="#00ffcc">IN  120  ICMP     10.100.2/24   Allow</text>
  <text x="670" y="375" font-family="monospace" font-size="7" fill="#6699cc">IN 4096  *        *             Deny</text>

  <text x="670" y="395" font-family="monospace" font-size="7" fill="#4477aa">HTTP from on-prem LAN</text>
  <text x="670" y="407" font-family="monospace" font-size="7" fill="#4477aa">All from tunnel + on-prem CIDRs</text>
  <text x="670" y="419" font-family="monospace" font-size="7" fill="#4477aa">SSH jump from FortiGate trust NIC</text>
  <text x="670" y="431" font-family="monospace" font-size="7" fill="#4477aa">ICMP diagnostics from trust subnet</text>

  <!-- UDR TABLE -->
  <rect x="60" y="490" width="860" height="140" rx="4" fill="#030812" stroke="rgba(0,255,204,0.2)" stroke-width="1"/>
  <rect x="60" y="490" width="860" height="22" rx="4" fill="rgba(0,255,204,0.06)"/>
  <text x="480" y="505" text-anchor="middle" font-family="monospace" font-size="9" fill="#00ffcc" letter-spacing="1">RT-WORKLOAD (UDR TABLE)</text>

  <!-- UDR headers -->
  <text x="90" y="530" font-family="monospace" font-size="8" fill="#6699cc" font-weight="600">NAME</text>
  <text x="320" y="530" font-family="monospace" font-size="8" fill="#6699cc" font-weight="600">PREFIX</text>
  <text x="540" y="530" font-family="monospace" font-size="8" fill="#6699cc" font-weight="600">NEXT HOP TYPE</text>
  <text x="740" y="530" font-family="monospace" font-size="8" fill="#6699cc" font-weight="600">NEXT HOP IP</text>
  <line x1="80" y1="535" x2="900" y2="535" stroke="rgba(77,166,255,0.15)" stroke-width="1"/>

  <!-- UDR rows -->
  <text x="90" y="550" font-family="monospace" font-size="8" fill="#eef6ff">force-default-fgt</text>
  <text x="320" y="550" font-family="monospace" font-size="8" fill="#eef6ff">0.0.0.0/0</text>
  <text x="540" y="550" font-family="monospace" font-size="8" fill="#eef6ff">VirtualAppliance</text>
  <text x="740" y="550" font-family="monospace" font-size="8" fill="#00ffcc">10.100.2.4</text>

  <text x="90" y="566" font-family="monospace" font-size="8" fill="#eef6ff">force-onprem-fgt</text>
  <text x="320" y="566" font-family="monospace" font-size="8" fill="#eef6ff">192.168.10.0/24</text>
  <text x="540" y="566" font-family="monospace" font-size="8" fill="#eef6ff">VirtualAppliance</text>
  <text x="740" y="566" font-family="monospace" font-size="8" fill="#00ffcc">10.100.2.4</text>

  <text x="90" y="582" font-family="monospace" font-size="8" fill="#eef6ff">force-tunnel-fgt</text>
  <text x="320" y="582" font-family="monospace" font-size="8" fill="#eef6ff">10.255.255.0/24</text>
  <text x="540" y="582" font-family="monospace" font-size="8" fill="#eef6ff">VirtualAppliance</text>
  <text x="740" y="582" font-family="monospace" font-size="8" fill="#00ffcc">10.100.2.4</text>

  <text x="90" y="598" font-family="monospace" font-size="8" fill="#eef6ff">local-workload</text>
  <text x="320" y="598" font-family="monospace" font-size="8" fill="#eef6ff">10.100.10.0/24</text>
  <text x="540" y="598" font-family="monospace" font-size="8" fill="#eef6ff">VirtualNetwork</text>
  <text x="740" y="598" font-family="monospace" font-size="8" fill="#4477aa">--</text>

  <text x="90" y="618" font-family="monospace" font-size="7" fill="#4477aa">All egress forced through FortiGate NVA (10.100.2.4). local-workload keeps intra-subnet traffic on the Azure fabric.</text>

  <!-- Flow arrows -->
  <line x1="590" y1="250" x2="640" y2="250" stroke="rgba(0,255,204,0.5)" stroke-width="1.5" filter="url(#glow)"/>
  <polygon points="637,246 645,250 637,254" fill="#00ffcc" opacity="0.6"/>

  <line x1="300" y1="250" x2="350" y2="250" stroke="rgba(77,166,255,0.4)" stroke-width="1.5"/>
  <polygon points="347,246 355,250 347,254" fill="#4da6ff" opacity="0.5"/>

  <!-- Bottom bar -->
  <line x1="100" y1="660" x2="860" y2="660" stroke="url(#divider-grad)" stroke-width="1"/>
  <text x="480" y="680" text-anchor="middle" font-family="monospace" font-size="9" fill="#4477aa">rg-hybrid-lab | tag: lab=hybrid-cloud | IP forwarding enabled on both FortiGate NICs</text>
  <text x="480" y="696" text-anchor="middle" font-family="monospace" font-size="8" fill="#ffaa00">VirtualNetwork service tag does NOT include tunnel IPs (10.255.255.0/24) or on-prem CIDRs (192.168.10.0/24)</text>

</svg>
